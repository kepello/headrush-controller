; CrowPanel 1.28" HMI ESP32-S3 Rotary Display (ELECROW)
; SoC: ESP32-S3 with 8MB embedded PSRAM (AP_3v3 variant), 16MB QIO flash.
; Uses pioarduino's espressif32 fork (Arduino-ESP32 v3.x / IDF v5.x) — the
; stock platform's bootloader doesn't support this silicon revision.

[platformio]
default_envs = crowpanel_128
boards_dir = boards

[env:crowpanel_128]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = elecrow_crowpanel_128
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    links2004/WebSockets @ ^2.6.1
    lovyan03/LovyanGFX @ ^1.1.16
    igorantolic/Ai Esp32 Rotary Encoder @ ^1.7

; Push firmware over WiFi instead of USB. The device must already be running
; OTA-capable firmware (flash crowpanel_128 over USB once first).
;   pio run -e crowpanel_128_ota -t upload
; If OTA_PASSWORD is set in secrets.h, uncomment upload_flags and match it.
[env:crowpanel_128_ota]
extends = env:crowpanel_128
upload_protocol = espota
upload_port = headrush-ctrl.local
; upload_flags =
;   --auth=YOUR_OTA_PASSWORD
